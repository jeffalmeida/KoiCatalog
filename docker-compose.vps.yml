# Stack para o VPS hermes — acessado via Tailscale, ZERO portas públicas novas.
# O Koi escuta SOMENTE no IP da tailnet (100.76.162.103), mesmo padrão dos demais
# containers deste host. Acesso pela tailnet: http://hermes:8080 (ou http://100.76.162.103:8080)
#
# As portas 80/443 deste host já são ocupadas pelo Traefik existente — não alteradas.
services:
  koi:
    image: koi-cards:latest
    container_name: koi-cards
    restart: unless-stopped
    ports:
      # Bindado apenas ao IP da tailnet — nada exposto à internet pública
      - "100.76.162.103:8080:3001"
    volumes:
      # Persistem os dados mesmo se o container for recriado
      - koi-data:/app/data
      - koi-uploads:/app/public/images/uploads

volumes:
  koi-data:
  koi-uploads:
